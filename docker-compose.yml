services:
  api:
    build:
      context: .
    #command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.local
    environment:
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./_app_data/document_data:/data/documents
      - ./_app_data/extraction_data:/data/extractions
      - ./src:/app/src
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-echomind-local-password}
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  document_data:
  extraction_data:
  neo4j_data:
  neo4j_logs:
